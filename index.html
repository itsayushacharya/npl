<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nepal Premier League · NPL Live</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(145deg, #0b0f1c 0%, #1a1f2f 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #eef2ff;
        }

        .card {
            max-width: 1000px;
            width: 100%;
            background: rgba(18, 22, 35, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 2.5rem;
            padding: 2rem 2rem 2rem;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 215, 0, 0.2);
            border: 1px solid rgba(255, 215, 0, 0.25);
            transition: all 0.2s ease;
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.75rem;
            border-bottom: 2px solid #ffd966;
            padding-bottom: 1rem;
        }

        .title-block {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .npl-badge {
            background: #ffd966;
            color: #0b0f1c;
            font-weight: 900;
            font-size: 1.8rem;
            letter-spacing: 2px;
            padding: 0.25rem 1rem;
            border-radius: 60px;
            box-shadow: 0 0 15px #ffd966aa;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            display: inline-block;
            line-height: 1.4;
        }

        .title-text {
            font-size: 1.9rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #ffe28c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #1f253b;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            border: 1px solid #ff4444;
            box-shadow: 0 0 12px #ff444488;
        }

        .red-dot {
            width: 14px;
            height: 14px;
            background: #ff3b3b;
            border-radius: 50%;
            animation: pulse 1.4s infinite;
            box-shadow: 0 0 10px #ff3b3b;
        }

        .live-text {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 1px;
            color: #ffb3b3;
            text-transform: uppercase;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 2rem;
            overflow: hidden;
            box-shadow: 0 20px 40px -10px black, 0 0 0 1px #ffd96666;
            aspect-ratio: 16 / 9;
            cursor: pointer;
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            background: #0a0c14;
        }

        /* Cleaned Up Play Overlay */
        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b0f1c; /* Solid clean background matching site theme */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .play-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .play-btn-circle {
            width: 100px;
            height: 100px;
            background: #ffd966;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.5), 0 0 15px rgba(255, 215, 0, 0.8);
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .play-btn-circle i {
            font-size: 2.8rem;
            color: #0b0f1c;
            margin-left: 10px; /* Centers the play triangle perfectly */
        }

        .video-wrapper:hover .play-btn-circle {
            transform: scale(1.05);
            background: #ffe28c;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.7), 0 0 20px rgba(255, 215, 0, 1);
        }

        .play-overlay p {
            margin-top: 1.5rem;
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #eef2ff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        /* Responsive */
        @media (max-width: 640px) {
            .card {
                padding: 1.5rem 1.2rem;
                border-radius: 2rem;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.8rem;
            }

            .title-text {
                font-size: 1.5rem;
            }

            .npl-badge {
                font-size: 1.4rem;
                padding: 0.2rem 0.8rem;
            }

            .live-indicator {
                align-self: flex-start;
            }

            .play-btn-circle {
                width: 75px;
                height: 75px;
            }
            
            .play-btn-circle i {
                font-size: 2rem;
            }

            .play-overlay p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Header -->
        <div class="header">
            <div class="title-block">
                <span class="npl-badge">NPL</span>
                <span class="title-text">NEPAL PREMIER LEAGUE</span>
            </div>
            <div class="live-indicator">
                <span class="red-dot"></span>
                <span class="live-text">LIVE</span>
            </div>
        </div>

        <!-- Video Player -->
        <div class="video-wrapper" id="videoContainer">
            <!-- Removed poster image entirely so it doesn't clash behind the overlay -->
            <video id="nplVideo" controls playsinline>
                Your browser does not support the video tag.
            </video>

            <!-- Clean Click to Watch Overlay -->
            <div class="play-overlay" id="playOverlay">
                <div class="play-btn-circle">
                    <i class="fas fa-play"></i>
                </div>
                <p>Click to Watch Live</p>
            </div>
        </div>
    </div>

    <!-- Load hls.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
    <script>
        (function() {
            const video = document.getElementById('nplVideo');
            const overlay = document.getElementById('playOverlay');
            const container = document.getElementById('videoContainer');
            const streamUrl = 'https://webott.viatv.com.np/wclive/HimaSportsWC/playlist.m3u8';

            let hls = null;

            // Setup HLS
            function setupStream() {
                const nativeHls = video.canPlayType('application/vnd.apple.mpegurl');

                if (nativeHls) {
                    video.src = streamUrl;
                } 
                else if (Hls.isSupported()) {
                    hls = new Hls({
                        debug: false,
                        enableWorker: true,
                        lowLatencyMode: true,
                        backBufferLength: 30,
                        maxBufferLength: 20,
                    });
                    hls.loadSource(streamUrl);
                    hls.attachMedia(video);
                    
                    hls.on(Hls.Events.ERROR, function(event, data) {
                        console.warn('HLS error:', data.type, data.details);
                        if (data.fatal) {
                            switch (data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    hls.startLoad();
                                    break;
                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    hls.recoverMediaError();
                                    break;
                                default:
                                    hls.destroy();
                                    break;
                            }
                        }
                    });
                } 
                else {
                    video.src = streamUrl;
                }
            }

            setupStream();

            // Start Playback on Click
            function startPlayback(e) {
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                
                // Hide overlay
                overlay.classList.add('hidden');
                
                // Play and unmute
                video.muted = false;
                video.play().catch(error => {
                    console.log('Playback failed:', error);
                    // If browser blocks it, show the overlay again
                    overlay.classList.remove('hidden');
                });
            }

            // Listen for clicks on the container
            container.addEventListener('click', startPlayback);

        })();
    </script>
</body>
</html>
